<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tulsa Sim</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0e14;
        color: #d7e2ee;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        background: rgba(10, 14, 20, 0.7);
        border: 1px solid #1f2a38;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
      }
      #hud h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.5px;
      }
      #hud .muted {
        color: #7d8da0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>TULSA SIM</h1>
      <div class="muted">dev environment scaffold · Vite + TS + Three.js</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
